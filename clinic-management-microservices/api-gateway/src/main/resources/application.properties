spring.application.name=api-gateway

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Route Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Route Patient Service
spring.cloud.gateway.server.webmvc.routes[1].id=patient-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/patients/**

# Route Doctor Service
spring.cloud.gateway.server.webmvc.routes[2].id=doctor-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://DOCTOR-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/doctors/**

# Route Appointment Service
spring.cloud.gateway.server.webmvc.routes[3].id=appointment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/appointments/**

# Route Medical Service
spring.cloud.gateway.server.webmvc.routes[4].id=medical-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://MEDICAL-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/medical-records/**

# Route Prescription Service
spring.cloud.gateway.server.webmvc.routes[5].id=prescription-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://PRESCRIPTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/prescriptions/**

# Route Payment Service
spring.cloud.gateway.server.webmvc.routes[6].id=payment-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/payments/**

# Route AI Service
spring.cloud.gateway.server.webmvc.routes[7].id=ai-service
spring.cloud.gateway.server.webmvc.routes[7].uri=http://127.0.0.1:8000
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/ai/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT
jwt.secret=ClinicManagementSystemJwtSecretKey2026ClinicManagementSystem


# Route Specialty APIs -> Doctor Service
spring.cloud.gateway.server.webmvc.routes[8].id=specialty-service
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://DOCTOR-SERVICE
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/specialties/**

# Route Vital Sign APIs -> Medical Service
spring.cloud.gateway.server.webmvc.routes[9].id=vital-sign-service
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://MEDICAL-SERVICE
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/vital-signs/**

# Route Medicine APIs -> Prescription Service
spring.cloud.gateway.server.webmvc.routes[10].id=medicine-service
spring.cloud.gateway.server.webmvc.routes[10].uri=lb://PRESCRIPTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/api/medicines/**

# Route Invoice APIs -> Payment Service
spring.cloud.gateway.server.webmvc.routes[11].id=invoice-service
spring.cloud.gateway.server.webmvc.routes[11].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[11].predicates[0]=Path=/api/invoices/**